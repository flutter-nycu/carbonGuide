<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarbonGuide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5f4, #f0faf9);
            color: #333;
        }
        .card {
            text-align: center;
            background: #fff;
            padding: 48px 40px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(44,185,176,0.12);
            max-width: 400px;
        }
        h1 {
            font-size: 2em;
            color: #2CB9B0;
            margin-bottom: 8px;
        }
        .tagline {
            color: #666;
            margin-bottom: 32px;
            font-size: 1.05em;
        }
        a {
            display: inline-block;
            color: #2CB9B0;
            text-decoration: none;
            padding: 10px 24px;
            border: 1.5px solid #2CB9B0;
            border-radius: 8px;
            transition: all 0.2s;
            font-size: 0.95em;
        }
        a:hover {
            background: #2CB9B0;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>CarbonGuide</h1>
        <p class="tagline">個人碳足跡計算與減碳建議</p>
        <a href="privacy-policy.html">隱私權政策</a>
    </div>
</body>
</html>
